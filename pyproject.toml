[build-system]
requires = [
    "ninja>=1.13.0",
    "nvidia-nccl-cu13==2.30.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvshmem-cu13==3.4.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "setuptools>=77.0.3,<81.0.0",
    "torch==2.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "deep-ep"
version = "2.1.0"
requires-python = ">=3.12"
dependencies = [
    "nvidia-nccl-cu13==2.30.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvshmem-cu13==3.4.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.13.0",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 140
indent_width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # key in dict.keys()
    "SIM118",
    # memory leaks
    "B019",
    # No such file or directory
    "E902",
]
exclude = [
    "deep_ep/__init__.py"
]
